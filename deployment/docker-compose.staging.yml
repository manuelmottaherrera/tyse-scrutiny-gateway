services:
  # PostgreSQL Database for Gateway
  postgres-gateway:
    image: postgres:17.4
    container_name: tyse-postgres-gateway-staging
    environment:
      POSTGRES_DB: ${GATEWAY_DB_NAME}
      POSTGRES_USER: ${GATEWAY_DB_USER}
      POSTGRES_PASSWORD: ${GATEWAY_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=es_ES.UTF-8'
    volumes:
      - gateway_db_data:/var/lib/postgresql/data
      - ./backup/gateway:/backup # Para facilitar backups/restore
    networks:
      - tyse-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432' # Solo accesible localmente

  # PostgreSQL Database for Divipol
  postgres-divipol:
    image: postgres:17.4
    container_name: tyse-postgres-divipol-staging
    environment:
      POSTGRES_DB: ${DIVIPOL_DB_NAME}
      POSTGRES_USER: ${DIVIPOL_DB_USER}
      POSTGRES_PASSWORD: ${DIVIPOL_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=es_ES.UTF-8'
    volumes:
      - divipol_db_data:/var/lib/postgresql/data
      - ./backup/divipol:/backup # Para facilitar backups/restore
    networks:
      - tyse-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '127.0.0.1:${DB_PORT_DIVIPOL:-5433}:5432' # Puerto diferente

  # Consul - Service Discovery
  consul:
    image: hashicorp/consul:1.21.0
    container_name: tyse-consul-staging
    ports:
      - '${CONSUL_PORT:-8510}:8500'
    command: consul agent -dev -ui -client 0.0.0.0 -log-level=INFO
    networks:
      - tyse-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'consul', 'members']
      interval: 10s
      timeout: 5s
      retries: 3

  # Kafka - Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.9.4
    container_name: tyse-kafka-staging
    ports:
      - '${KAFKA_PORT:-9102}:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    depends_on:
      - zookeeper
    networks:
      - tyse-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'kafka-broker-api-versions', '--bootstrap-server=localhost:9092']
      interval: 10s
      timeout: 10s
      retries: 5

  # Zookeeper (required by Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.4
    container_name: tyse-zookeeper-staging
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - tyse-network
    restart: unless-stopped

  # MailHog - Email Testing Tool
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: tyse-mailhog-staging
    ports:
      - '${MAILHOG_SMTP_PORT:-1035}:1025' # SMTP server
      - '${MAILHOG_UI_PORT:-8035}:8025' # Web UI
    networks:
      - tyse-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8025']
      interval: 10s
      timeout: 5s
      retries: 3

  # Gateway Application
  gateway:
    image: ${REGISTRY}/${GATEWAY_IMAGE}:${IMAGE_TAG_GATEWAY:-develop}
    container_name: tyse-gateway-staging
    ports:
      - '${GATEWAY_PORT:-8090}:8080'
    environment:
      # Spring Profiles
      - SPRING_PROFILES_ACTIVE=staging,api-docs
      - JHIPSTER_SLEEP=30

      # Database Configuration (Dockerized PostgreSQL)
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres-gateway:5432/${GATEWAY_DB_NAME}
      - SPRING_R2DBC_USERNAME=${GATEWAY_DB_USER}
      - SPRING_R2DBC_PASSWORD=${GATEWAY_DB_PASSWORD}
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://postgres-gateway:5432/${GATEWAY_DB_NAME}
      - SPRING_LIQUIBASE_USER=${GATEWAY_DB_USER}
      - SPRING_LIQUIBASE_PASSWORD=${GATEWAY_DB_PASSWORD}

      # Consul Configuration
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500

      # Kafka Configuration
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092

      # JWT Secret (MUST be provided via environment)
      - JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET=${JWT_SECRET}

      # Logging
      - LOGGING_LEVEL_ROOT=INFO
      - LOGGING_LEVEL_COM_TYSE_SCRUTINY=DEBUG

      # CORS Configuration
      - JHIPSTER_CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8090}

      # Google reCAPTCHA Configuration
      - GOOGLE_RECAPTCHA_SITE_KEY=${GOOGLE_RECAPTCHA_SITE_KEY}
      - GOOGLE_RECAPTCHA_SECRET_KEY=${GOOGLE_RECAPTCHA_SECRET_KEY}

      # Mail Configuration (MailHog)
      - SPRING_MAIL_HOST=mailhog
      - SPRING_MAIL_PORT=1025
      - SPRING_MAIL_USERNAME=
      - SPRING_MAIL_PASSWORD=
      - SPRING_MAIL_PROTOCOL=smtp
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=false
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=false
      - MANAGEMENT_HEALTH_MAIL_ENABLED=true

    depends_on:
      postgres-gateway:
        condition: service_healthy
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    networks:
      - tyse-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/management/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Divipol Microservice
  divipol:
    image: ${REGISTRY}/${DIVIPOL_IMAGE}:${IMAGE_TAG_DIVIPOL:-develop}
    container_name: tyse-divipol-staging
    ports:
      - '${DIVIPOL_PORT:-8091}:8081'
    environment:
      # Spring Profiles
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - JHIPSTER_SLEEP=30

      # Database Configuration (Dockerized PostgreSQL)
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres-divipol:5432/${DIVIPOL_DB_NAME}
      - SPRING_R2DBC_USERNAME=${DIVIPOL_DB_USER}
      - SPRING_R2DBC_PASSWORD=${DIVIPOL_DB_PASSWORD}
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://postgres-divipol:5432/${DIVIPOL_DB_NAME}
      - SPRING_LIQUIBASE_USER=${DIVIPOL_DB_USER}
      - SPRING_LIQUIBASE_PASSWORD=${DIVIPOL_DB_PASSWORD}

      # Consul Configuration
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500

      # Kafka Configuration
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092

      # JWT Secret (MUST match gateway)
      - JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET=${JWT_SECRET}

      # Logging
      - LOGGING_LEVEL_ROOT=INFO
      - LOGGING_LEVEL_COM_TYSE_SCRUTINY=DEBUG

    depends_on:
      postgres-divipol:
        condition: service_healthy
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tyse-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8081/management/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  tyse-network:
    driver: bridge
    name: tyse-staging-network

# Named volumes for data persistence
volumes:
  gateway_db_data:
    name: tyse-gateway-db-staging
  divipol_db_data:
    name: tyse-divipol-db-staging
