services:
  # Consul - Service Discovery
  consul:
    image: hashicorp/consul:1.21.0
    container_name: tyse-consul-staging
    ports:
      - '${CONSUL_PORT:-8510}:8500'
    command: consul agent -dev -ui -client 0.0.0.0 -log-level=INFO
    networks:
      - tyse-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'consul', 'members']
      interval: 10s
      timeout: 5s
      retries: 3

  # Kafka - Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.9.4
    container_name: tyse-kafka-staging
    ports:
      - '${KAFKA_PORT:-9102}:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9102}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    depends_on:
      - zookeeper
    networks:
      - tyse-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'kafka-broker-api-versions', '--bootstrap-server=localhost:9092']
      interval: 10s
      timeout: 10s
      retries: 5

  # Zookeeper (required by Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.4
    container_name: tyse-zookeeper-staging
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - tyse-network
    restart: unless-stopped

  # Gateway Application
  gateway:
    image: ${REGISTRY}/${GATEWAY_IMAGE}:${IMAGE_TAG_GATEWAY:-develop}
    container_name: tyse-gateway-staging
    ports:
      - '${GATEWAY_PORT:-8090}:8080'
    environment:
      # Spring Profiles
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - JHIPSTER_SLEEP=30

      # Database Configuration (External PostgreSQL)
      - SPRING_R2DBC_URL=r2dbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${GATEWAY_DB_NAME}
      - SPRING_R2DBC_USERNAME=${GATEWAY_DB_USER}
      - SPRING_R2DBC_PASSWORD=${GATEWAY_DB_PASSWORD}
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${GATEWAY_DB_NAME}

      # Consul Configuration
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500

      # Kafka Configuration
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092

      # JWT Secret (MUST be provided via environment)
      - JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET=${JWT_SECRET}

      # Logging
      - LOGGING_LEVEL_ROOT=INFO
      - LOGGING_LEVEL_COM_TYSE_SCRUTINY=DEBUG

      # CORS Configuration
      - JHIPSTER_CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8090}

    depends_on:
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tyse-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/management/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Divipol Microservice
  divipol:
    image: ${REGISTRY}/${DIVIPOL_IMAGE}:${IMAGE_TAG_DIVIPOL:-develop}
    container_name: tyse-divipol-staging
    ports:
      - '${DIVIPOL_PORT:-8091}:8081'
    environment:
      # Spring Profiles
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - JHIPSTER_SLEEP=30

      # Database Configuration (External PostgreSQL)
      - SPRING_R2DBC_URL=r2dbc:postgresql://${DB_HOST}:${DB_PORT_DIVIPOL:-5433}/${DIVIPOL_DB_NAME}
      - SPRING_R2DBC_USERNAME=${DIVIPOL_DB_USER}
      - SPRING_R2DBC_PASSWORD=${DIVIPOL_DB_PASSWORD}
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT_DIVIPOL:-5433}/${DIVIPOL_DB_NAME}

      # Consul Configuration
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500

      # Kafka Configuration
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092

      # JWT Secret (MUST match gateway)
      - JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET=${JWT_SECRET}

      # Logging
      - LOGGING_LEVEL_ROOT=INFO
      - LOGGING_LEVEL_COM_TYSE_SCRUTINY=DEBUG

    depends_on:
      consul:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tyse-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8081/management/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  tyse-network:
    driver: bridge
    name: tyse-staging-network
