name: Gateway - CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Backend Tests
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-gateway-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-gateway

      - name: Run Backend Tests
        run: |
          chmod +x mvnw
          ./mvnw clean verify \
            -Dlogging.level.ROOT=ERROR \
            -Dlogging.level.tech.jhipster=ERROR \
            -Dlogging.level.com.tyse.scrutiny=ERROR

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-backend-test-results
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-backend-coverage
          path: target/site/jacoco/
          retention-days: 7

  # Frontend Tests
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run prettier:check

      - name: Run ESLint
        run: npm run lint

      - name: Run Frontend Tests
        run: npm run test-ci

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-frontend-test-results
          path: target/test-results/
          retention-days: 7

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-frontend-coverage
          path: target/test-results/jest/coverage/
          retention-days: 7

  # E2E Tests (optional - only on main/develop)
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build E2E package
        run: npm run ci:e2e:package

      - name: Prepare E2E environment
        run: npm run ci:e2e:prepare:docker

      - name: Run E2E tests
        run: npm run ci:e2e:run

      - name: Teardown E2E environment
        if: always()
        run: npm run ci:e2e:teardown:docker

      - name: Upload E2E Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-e2e-test-results
          path: target/cypress/
          retention-days: 7

  # Quality Gate
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "Backend Tests: ${{ needs.backend-tests.result }}"
          echo "Frontend Tests: ${{ needs.frontend-tests.result }}"

          if [ "${{ needs.backend-tests.result }}" != "success" ] || \
             [ "${{ needs.frontend-tests.result }}" != "success" ]; then
            echo "❌ CI Pipeline Failed - One or more test suites failed"
            exit 1
          fi

          echo "✅ CI Pipeline Passed - All tests successful"
