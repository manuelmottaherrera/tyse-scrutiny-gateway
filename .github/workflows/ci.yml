name: Gateway - CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '22.15.0'

jobs:
  # ============================================================================
  # Job 1: Code Quality (se ejecuta primero, fail fast)
  # Verifica formatting y reglas de código
  # ============================================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Node dependencies
        run: npm ci

      - name: Check Prettier formatting
        run: npm run prettier:check

      - name: Check nohttp (detect http:// URLs)
        run: npm run backend:nohttp:test

  # ============================================================================
  # Job 2: Liquibase Verification
  # Verifica que las migraciones funcionan correctamente (update → rollback → update)
  # Solo se ejecuta si Code Quality pasa (fail fast)
  # ============================================================================
  liquibase-verification:
    name: Liquibase Verification
    runs-on: ubuntu-latest
    needs: [code-quality]
    timeout-minutes: 10

    services:
      postgresql:
        image: postgres:17.4
        env:
          POSTGRES_DB: tyseScrutinyGateway
          POSTGRES_USER: tyseScrutinyGateway
          POSTGRES_PASSWORD: ''
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile project
        run: |
          chmod +x mvnw
          ./mvnw compile -DskipTests -q

      - name: Step 1 - Apply all changesets
        run: |
          ./mvnw liquibase:update \
            -Dlogging.level.ROOT=ERROR \
            -Dlogging.level.liquibase=INFO

      - name: Step 2 - Rollback to initial state
        run: |
          ./mvnw liquibase:rollback -Dliquibase.rollbackTag=estado-vacio \
            -Dlogging.level.ROOT=ERROR \
            -Dlogging.level.liquibase=INFO

      - name: Step 3 - Re-apply all changesets
        run: |
          ./mvnw liquibase:update \
            -Dlogging.level.ROOT=ERROR \
            -Dlogging.level.liquibase=INFO

  # ============================================================================
  # Job 3: Backend Tests
  # Ejecuta unit tests e integration tests con Testcontainers
  # Solo se ejecuta si Liquibase Verification pasa (fail fast)
  # ============================================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [liquibase-verification]
    timeout-minutes: 20

    services:
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-gateway-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-gateway

      - name: Run Backend Tests
        env:
          # Fix Testcontainers hostname resolution in GitHub Actions
          TESTCONTAINERS_HOST_OVERRIDE: localhost
        run: |
          chmod +x mvnw
          ./mvnw clean verify \
            -Dlogging.level.ROOT=ERROR \
            -Dlogging.level.tech.jhipster=ERROR \
            -Dlogging.level.com.tyse.scrutiny=ERROR

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-backend-test-results
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-backend-coverage
          path: target/site/jacoco/
          retention-days: 7

  # ============================================================================
  # Job 4: Frontend Tests
  # Ejecuta tests de Jest y verifica linting
  # Solo se ejecuta si Code Quality pasa (puede correr en paralelo con Liquibase)
  # ============================================================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [code-quality]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Frontend Tests
        run: npm run test-ci

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-frontend-test-results
          path: target/test-results/
          retention-days: 7

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-frontend-coverage
          path: target/test-results/jest/coverage/
          retention-days: 7

  # ============================================================================
  # Job 5: E2E Tests (optional - only on push to main/develop)
  # Ejecuta tests end-to-end con Cypress
  # ============================================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Checkout gateway code
        uses: actions/checkout@v4

      - name: Checkout microservice divipol
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/tyse-scrutiny-micro-divipol
          path: micro-divipol
          ref: ${{ github.ref_name }}

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Build microservice divipol Docker image
        working-directory: micro-divipol
        run: |
          chmod +x mvnw
          ./mvnw -ntp package -DskipTests jib:dockerBuild

      - name: Verify divipol image exists
        run: docker images tysescrutinymicrodivipol:latest

      - name: Install gateway dependencies
        run: npm ci

      - name: Build E2E package
        run: npm run ci:e2e:package

      - name: Prepare E2E environment
        run: npm run ci:e2e:prepare:docker

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Docker containers status ==="
          docker ps -a
          echo "=== Microservice divipol logs ==="
          docker logs tysescrutinygateway-e2e-micro-divipol-1 2>&1 | tail -200 || true
          echo "=== PostgreSQL divipol logs ==="
          docker logs tysescrutinygateway-e2e-postgresql-divipol-1 2>&1 | tail -50 || true

      - name: Run E2E tests
        run: npm run ci:e2e:run

      - name: Teardown E2E environment
        if: always()
        run: npm run ci:e2e:teardown:docker

      - name: Upload E2E Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-e2e-test-results
          path: target/cypress/
          retention-days: 7

  # ============================================================================
  # Quality Gate
  # Verifica que todos los jobs pasaron
  # ============================================================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [liquibase-verification, backend-tests, frontend-tests, code-quality]
    if: always()

    steps:
      - name: Check all job results
        run: |
          echo "Liquibase Verification: ${{ needs.liquibase-verification.result }}"
          echo "Backend Tests: ${{ needs.backend-tests.result }}"
          echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "Code Quality: ${{ needs.code-quality.result }}"

          if [ "${{ needs.liquibase-verification.result }}" != "success" ] || \
             [ "${{ needs.backend-tests.result }}" != "success" ] || \
             [ "${{ needs.frontend-tests.result }}" != "success" ] || \
             [ "${{ needs.code-quality.result }}" != "success" ]; then
            echo "❌ CI Pipeline Failed - One or more jobs failed"
            exit 1
          fi

          echo "✅ CI Pipeline Passed - All jobs successful"
