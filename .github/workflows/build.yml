name: Gateway - Build Docker Image

on:
  workflow_run:
    workflows: ['Gateway - CI Pipeline']
    types: [completed]
    branches: [main, develop]
  workflow_dispatch: # Permite ejecución manual si es necesario

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Check if CI passed
  check-ci:
    name: Check CI Status
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run'
    steps:
      - name: Check CI Pipeline Result
        if: github.event.workflow_run.conclusion != 'success'
        run: |
          echo "CI Pipeline failed - skipping build"
          exit 1

  # Build Docker Image
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build production JAR
        env:
          REACT_APP_RECAPTCHA_SITE_KEY: ${{ secrets.STAGING_RECAPTCHA_SITE_KEY }}
        run: |
          chmod +x mvnw
          ./mvnw -Pprod clean verify -DskipTests

      - name: Extract image tags
        id: meta
        run: |
          # Extract branch or tag name
          if [[ $GITHUB_REF == refs/heads/* ]]; then
            BRANCH=${GITHUB_REF#refs/heads/}
            echo "BRANCH=$BRANCH" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=$BRANCH" >> $GITHUB_OUTPUT
          elif [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            echo "TAG=$TAG" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=$TAG" >> $GITHUB_OUTPUT
          fi

          # Extract short SHA
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Build and push Docker image with Jib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REACT_APP_RECAPTCHA_SITE_KEY: ${{ secrets.STAGING_RECAPTCHA_SITE_KEY }}
        run: |
          IMAGE_TAG=${{ steps.meta.outputs.IMAGE_TAG }}
          SHORT_SHA=${{ steps.meta.outputs.SHORT_SHA }}

          # Build and push with Jib
          ./mvnw -Pprod verify jib:build \
            -Djib.to.image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG} \
            -Djib.to.tags=${IMAGE_TAG}-${SHORT_SHA},latest \
            -Djib.to.auth.username=${{ github.actor }} \
            -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }} \
            -DskipTests

      - name: Image digest
        run: |
          echo "✅ Gateway Docker image built successfully"
          echo "📦 Registry: ${{ env.REGISTRY }}"
          echo "🏷️  Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.IMAGE_TAG }}"
          echo "🏷️  Tags: ${{ steps.meta.outputs.IMAGE_TAG }}, ${{ steps.meta.outputs.IMAGE_TAG }}-${{ steps.meta.outputs.SHORT_SHA }}, latest"

      - name: Trigger deployment (if develop branch)
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: gateway-image-ready
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}", "image_tag": "${{ steps.meta.outputs.version }}"}'
