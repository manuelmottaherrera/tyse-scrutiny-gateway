# Docker Compose for E2E testing in CI (GitHub Actions)
# Self-contained: includes all infrastructure services
# Use services-e2e.yml for local development (requires tyse-scrutiny-infrastructure)
name: tysescrutinygateway-e2e
services:
  # Gateway PostgreSQL (port 5432)
  postgresql:
    extends:
      file: ./postgresql.yml
      service: postgresql

  # Consul for service discovery
  consul:
    extends:
      file: ./consul.yml
      service: consul
  consul-config-loader:
    extends:
      file: ./consul.yml
      service: consul-config-loader

  # Kafka with listeners for both internal (docker) and external (localhost)
  kafka:
    image: apache/kafka-native:4.0.0
    ports:
      - 127.0.0.1:9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9093,EXTERNAL://:9092,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9094
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    labels:
      org.springframework.boot.ignore: true

  # MinIO - Object Storage for PDF documents
  minio:
    image: minio/minio:latest
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    environment:
      MINIO_ROOT_USER: tyseadmin
      MINIO_ROOT_PASSWORD: tyseadmin123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      org.springframework.boot.ignore: true

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 tyseadmin tyseadmin123;
      mc mb --ignore-existing myminio/tyse-scrutiny-documents;
      mc anonymous set download myminio/tyse-scrutiny-documents;
      exit 0;
      "
    labels:
      org.springframework.boot.ignore: true

  # MailHog for email testing
  mailhog:
    extends:
      file: ./mailhog.yml
      service: mailhog

  # Microservice Divipol - PostgreSQL (port 5433)
  postgresql-divipol:
    image: postgres:17.4
    environment:
      - POSTGRES_USER=tyseScrutinyMicroDivipol
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 127.0.0.1:5433:5432

  # Microservice Divipol - Application (port 8081)
  micro-divipol:
    image: tysescrutinymicrodivipol:latest
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - SPRING_DOCKER_COMPOSE_ENABLED=false
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgresql-divipol:5432/tyseScrutinyMicroDivipol
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://postgresql-divipol:5432/tyseScrutinyMicroDivipol
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:9093
    ports:
      - 127.0.0.1:8081:8081
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8081/management/health']
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    depends_on:
      postgresql-divipol:
        condition: service_healthy
      consul:
        condition: service_started
      kafka:
        condition: service_started

  # Microservice Scrutiny - PostgreSQL (port 5434)
  postgresql-scrutiny:
    image: postgres:17.4
    environment:
      - POSTGRES_USER=tyseScrutinyMicroScrutiny
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 127.0.0.1:5434:5432

  # Microservice Scrutiny - Application (port 8084)
  micro-scrutiny:
    image: tysescrutinymicroscrutiny:latest
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - SPRING_DOCKER_COMPOSE_ENABLED=false
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgresql-scrutiny:5432/tyseScrutinyMicroScrutiny
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://postgresql-scrutiny:5432/tyseScrutinyMicroScrutiny
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:9093
    ports:
      - 127.0.0.1:8084:8084
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8084/management/health']
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    depends_on:
      postgresql-scrutiny:
        condition: service_healthy
      consul:
        condition: service_started
      kafka:
        condition: service_started
